[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tdoc"
version = "2.6.0"
description = "SOTA Termux System Integrity Diagnostics & Control HUD"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "u0_a330" }
]
dependencies = [
    "requests>=2.34.2",
    "rich>=14.1.0",
    "urllib3>=2.7.0",
]

[project.scripts]
tdoc = "main:run_system_main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.black]
target-version = ['py314']
