[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tdoc"
version = "5.4.9"
description = "SOTA Termux System Integrity Diagnostics & Control HUD"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "FJ-cyberzilla" }
]
dependencies = [
    "requests>=2.34.2",
    "rich>=14.1.0",
    "urllib3>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
    "radon>=6.0.1",
]

[project.scripts]
tdoc = "src.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["BLE001", "S110", "RUF012"]

[tool.uv]
link-mode = "copy"
