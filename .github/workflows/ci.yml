name: Makefile CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh

    - name: Install dependencies with dev extras
      run: uv sync --dev  # This installs ruff, pytest, radon

    - name: Show TDOC Help
      run: make help

    - name: Run lint
      run: uv run make lint

    - name: Run diagnose
      run: uv run make diagnose

    - name: Run tests
      run: uv run make test
