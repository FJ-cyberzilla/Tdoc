name: Makefile CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh

    - name: Install dev dependencies
      run: uv sync --dev

    - name: Inspect environment
      run: |
        uv run which python
        uv run which ruff
        ls -la .venv

    - name: Show TDOC Help
      run: make help

    - name: Run lint
      run: make lint

    - name: Run format check (non-modifying)
      run: uv run ruff format --check --line-length 100 .

    - name: Run diagnose
      run: make diagnose

    - name: Run tests with coverage
      run: uv run pytest -v --cov=src --cov-report=term

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: .pytest_cache/
